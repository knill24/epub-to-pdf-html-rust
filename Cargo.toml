[package]
name = "epub_converter"
version = "0.1.0"
edition = "2024"

[dependencies]
# For parsing the EPUB file structure
epub = "2.1.0"
# For the high-efficiency rendering engine
headless_chrome = "1.0.15"
# To help with file paths
anyhow = "1.0"
# to strip out the "wrapper" tags from every chapter so only the raw text and images remain for the html page
regex = "1.10"
# to handle file paths with spaces correctly to add the images to the pdf
urlencoding = "2.1"
# UI Framework
slint = "1.3.2"
# Native File Dialogs
rfd = "0.12"

[build-dependencies]
slint-build = "1.3.2"